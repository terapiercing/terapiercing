<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RBClinic - Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="style.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #FAF7F5;
      color: #2D2D2D;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .card {
      width: 100%;
      max-width: 28rem;
    }
    .card .header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .card .header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.25rem;
      letter-spacing: -0.025em;
      color: #D4AF37;
    }
    .card .header p {
      margin-top: 0.5rem;
      font-size: 0.875rem;
      color: #8a8a8a;
    }
    form { display: flex; flex-direction: column; gap: 1.5rem; }
    .fields { display: flex; flex-direction: column; gap: 1rem; }
    .field label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      color: #52525b;
      margin-bottom: 0.25rem;
    }
    .field input {
      width: 100%;
      border: 1px solid #d4d4d8;
      border-radius: 0.5rem;
      padding: 0.75rem 1rem;
      font-size: 0.875rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .field input:focus {
      border-color: #E1A293;
      box-shadow: 0 0 0 2px rgba(225, 162, 147, 0.2);
    }
    .field input::placeholder { color: #a1a1aa; }
    .btn-submit {
      width: 100%;
      border: none;
      border-radius: 0.5rem;
      background: #E1A293;
      padding: 0.75rem 1rem;
      font-size: 0.875rem;
      font-weight: 600;
      color: white;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-submit:hover { background: #d48d7c; }
    .footer-text {
      margin-top: 1rem;
      text-align: center;
      font-size: 0.875rem;
      color: #8a8a8a;
    }
    .footer-text a {
      font-weight: 500;
      color: #E1A293;
      text-decoration: none;
    }
    .footer-text a:hover { color: #d48d7c; }
    .back-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: #f0eeeb;
      padding: 0.5rem 0;
      text-align: center;
    }
    .back-bar a {
      color: #8a8a8a;
      font-size: 0.8rem;
      text-decoration: none;
    }
    .back-bar a:hover { color: #E1A293; }
  </style>
</head>
<body>
  <div class="back-bar">
    <a href="index.html">&larr; Voltar ao índice</a>
  </div>
  <div class="card">
    <div class="header">
      <h1>RBClinic</h1>
      <p>Entre com seus dados para acessar</p>
    </div>
    <form onsubmit="event.preventDefault(); window.location.href='dashboard.html'">
      <div class="fields">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" placeholder="seu@email.com" value="maria@example.com">
        </div>
        <div class="field">
          <label for="password">Senha</label>
          <input id="password" type="password" placeholder="••••••••" value="123456">
        </div>
      </div>
      <button type="submit" class="btn-submit">Entrar</button>
    </form>
    <p class="footer-text">
      Ainda não tem conta?
      <a href="cadastro.html">Cadastre-se</a>
    </p>
  </div>
</body>
</html>
